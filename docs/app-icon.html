<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<!--
			Render source for the installed-app icons (#89).

			The glyph is `static/favicon.svg` verbatim — the skull-and-tricorn mark
			already in the browser tab. A Home Screen icon is the same job at a
			larger size, and a person who installs from a tab should recognise what
			lands on their springboard.

			Two variants, because the platforms crop differently:

			- **any** — full-bleed, glyph at 72%. iOS and desktop show the square (or
			  their own rounding) exactly as given.
			- **maskable** — glyph at 52%. Android applies an arbitrary mask, and only
			  a circle of 80% diameter is guaranteed to survive it. Anything outside
			  that safe zone can be cropped on some launchers and not others.

			Both are the app's own background: slate-950 with the hero's orange glow,
			so the icon reads as the same surface the app opens onto.

			Rendered by the command in docs/deployment.md § App icons. PNG rather than
			JPEG here — these are flat vector art with hard edges, where JPEG's
			ringing is visible and its size advantage is not.
		-->
		<style>
			* {
				margin: 0;
				padding: 0;
			}

			html,
			body {
				width: 512px;
				height: 512px;
				overflow: hidden;
			}

			.icon {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				width: 512px;
				height: 512px;
				background:
					radial-gradient(
						circle at 50% 42%,
						rgba(249, 115, 22, 0.22) 0%,
						rgba(249, 115, 22, 0.06) 45%,
						transparent 68%
					),
					#0a0c10;
			}

			/* The mark's art sits high in its 100×100 box (roughly y 11→83), so it
			   needs a nudge down to read as optically centred in the square. */
			.icon svg {
				width: 72%;
				height: 72%;
				transform: translateY(2.5%);
			}

			.icon.maskable svg {
				width: 52%;
				height: 52%;
			}
		</style>
	</head>
	<body>
		<div class="icon">
			<svg
				viewBox="0 0 100 100"
				xmlns="http://www.w3.org/2000/svg"
				fill="none"
				stroke="#c2410c"
				stroke-linecap="round"
				stroke-linejoin="round"
			>
				<!-- Skull -->
				<path
					d="M27 45c-2 8-1 15 3 21 1.6 2.6 2.5 4.6 2.5 6.5V74c0 2 1.6 3.5 3.5 3.5h28c1.9 0 3.5-1.5 3.5-3.5v-1.5c0-1.9 0.9-3.9 2.5-6.5 4-6 5-13 3-21C73 31 27 31 27 45z"
					fill="#fdba74"
					stroke-width="2.6"
				/>
				<ellipse cx="38" cy="57" rx="7" ry="8" fill="#0a0c10" stroke-width="2.4" />
				<ellipse cx="62" cy="57" rx="7" ry="8" fill="#0a0c10" stroke-width="2.4" />
				<path d="M50 62 45.5 71h9z" fill="#0a0c10" stroke-width="1.8" />
				<path
					d="M40 75v6.5a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V75M47.5 75v6.5a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V75M55 75v6.5a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V75"
					fill="#fed7aa"
					stroke="#c2410c"
					stroke-width="1.4"
				/>
				<!-- Tricorn hat — filled orange so the silhouette reads on light and dark backgrounds -->
				<path
					d="M14 40c-2-13 6-23 20-27 5-1.4 11-1.4 16 0 5-1.4 11-1.4 16 0 14 4 22 14 20 27-9-5-19-7-32-6-13-1-23 1-32 6z"
					fill="#c2410c"
					stroke="#fb923c"
					stroke-width="2.2"
				/>
				<g stroke="#fed7aa" stroke-width="2.2" fill="#fed7aa">
					<path d="M40 14 56 22" />
					<path d="M56 14 40 22" />
					<circle cx="38.5" cy="13.5" r="1.2" />
					<circle cx="40.5" cy="11.5" r="1.2" />
					<circle cx="57.5" cy="22.5" r="1.2" />
					<circle cx="55.5" cy="24.5" r="1.2" />
					<circle cx="38.5" cy="22.5" r="1.2" />
					<circle cx="40.5" cy="24.5" r="1.2" />
					<circle cx="57.5" cy="13.5" r="1.2" />
					<circle cx="55.5" cy="11.5" r="1.2" />
				</g>
			</svg>
		</div>

		<script>
			// `?maskable` selects the shrunken variant. A query string rather than a
			// second HTML file so the two icons cannot drift apart.
			if (location.search.includes('maskable')) {
				document.querySelector('.icon').classList.add('maskable');
			}
		</script>
	</body>
</html>
