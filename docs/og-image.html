				height: 700px;
				background: radial-gradient(

				letter-spacing: 0.22em;
				text-transform: uppercase;
				color: #fb923c;
				margin-bottom: 20px;
			}
			h1 {
				font-size: 78px;
				font-weight: 800;
				letter-spacing: -0.025em;
				line-height: 1.02;
				color: #fff;
			}
			h1 .accent {
				color: #fdba74;
			}
			p {

				font-size: 27px;
